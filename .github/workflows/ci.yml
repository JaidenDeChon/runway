name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # postinstall runs `nuxt prepare`, which generates .nuxt/tsconfig.*.json.
      # `bun run typecheck` depends on that having happened.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (vue-tsc + domain tsc)
        run: bun run typecheck

      # Unit only — this job has no database. The `integration` project needs a
      # live stack and runs in `database` below; Playwright runs in `e2e`.
      # Running the unit project in both jobs is a few seconds of duplication
      # bought for fast feedback when a pure-logic test breaks.
      - name: Unit tests (Vitest)
        run: bun run test:unit

      - name: Production build
        run: bun run build

  database:
    name: Migrations, generated types, RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # Pinned to the version docs/database/local-development.md names. `supabase
      # gen types` output varies between CLI versions, and the types check below
      # compares against a file generated on a developer's machine — so when the
      # documented local version moves, move this with it.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.76.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `supabase start` applies every migration to an empty database and loads
      # the seed, so a migration that cannot apply from zero fails here.
      #
      # The excluded containers are the ones nothing under test touches. What
      # stays is what the suite actually speaks to: postgres, kong (the API URL),
      # gotrue (signInWithPassword) and postgrest. Dropping the rest is minutes
      # of image pulls per run.
      - name: Start the local Supabase stack
        run: |
          # `supabase start` ends with a banner listing the stack's publishable
          # and secret keys. They are ephemeral local-stack credentials, worth
          # nothing off the runner — but issue #5 requires that CI logs contain
          # no tokens, and "it is only a local key" is how that requirement
          # erodes. The banner is captured rather than printed; on failure it is
          # echoed back with any key-shaped string redacted, so a stack that
          # will not come up is still diagnosable.
          set -o pipefail
          if ! supabase start \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,storage-api,realtime \
            > supabase-start.log 2>&1; then
            sed -E \
              -e 's/sb_(publishable|secret)_[A-Za-z0-9_-]+/<redacted>/g' \
              -e 's/eyJ[A-Za-z0-9._-]{10,}/<redacted>/g' \
              -e 's#postgresql://[^[:space:]]+#<redacted>#g' \
              supabase-start.log
            exit 1
          fi
          echo 'Local Supabase stack is up.'

      # shared/supabase/database.types.ts is generated and committed. If it no
      # longer matches what the migrations produce, every consumer is typed
      # against a schema that does not exist.
      - name: Generated types match the migrations
        run: |
          bun run db:types
          if ! git diff --quiet -- shared/supabase/database.types.ts; then
            echo '::error::shared/supabase/database.types.ts is stale.'
            echo 'Run `bun run db:types` against a reset local stack and commit the result.'
            git --no-pager diff -- shared/supabase/database.types.ts
            exit 1
          fi

      # The whole suite, not `test:integration`: this is the one job with a
      # database, so it is the one that must run every project Vitest has —
      # including any component project added later, with no edit to this file.
      #
      # RUNWAY_RLS_REQUIRE_STACK makes a missing stack a hard error. Without it
      # the integration project skips itself and CI reports green for a database
      # nothing checked. See tests/support/global-setup.ts.
      - name: Full test suite (unit + integration, nothing skipped)
        env:
          RUNWAY_RLS_REQUIRE_STACK: '1'
        run: bun run test

      # Deliberately NOT `supabase status`: it prints the stack's keys and its
      # database connection string, and the issue this suite was built for
      # requires that CI logs carry neither. Container state is what is
      # actually diagnostic when the stack fails to come up.
      - name: Stack diagnostics
        if: failure()
        run: docker ps -a --format 'table {{.Names}}\t{{.Status}}'

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # Same pin as the `database` job — see the note there.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.76.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Only chromium. Both Playwright projects (desktop and the 375px mobile
      # viewport) are chromium-backed, so pulling firefox and webkit would be
      # minutes of download per run for browsers nothing launches.
      - name: Install the Playwright browser
        run: bun run test:e2e:install

      # The authenticated-session fixture signs in against the local GoTrue and
      # seeds through PostgREST, so the stack has to be up even though the app
      # does not read it yet. Same trimmed container set as the `database` job.
      - name: Start the local Supabase stack
        run: |
          # `supabase start` ends with a banner listing the stack's publishable
          # and secret keys. They are ephemeral local-stack credentials, worth
          # nothing off the runner — but issue #5 requires that CI logs contain
          # no tokens, and "it is only a local key" is how that requirement
          # erodes. The banner is captured rather than printed; on failure it is
          # echoed back with any key-shaped string redacted, so a stack that
          # will not come up is still diagnosable.
          set -o pipefail
          if ! supabase start \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,storage-api,realtime \
            > supabase-start.log 2>&1; then
            sed -E \
              -e 's/sb_(publishable|secret)_[A-Za-z0-9_-]+/<redacted>/g' \
              -e 's/eyJ[A-Za-z0-9._-]{10,}/<redacted>/g' \
              -e 's#postgresql://[^[:space:]]+#<redacted>#g' \
              supabase-start.log
            exit 1
          fi
          echo 'Local Supabase stack is up.'

      # Built here rather than inside Playwright's `webServer` command, so that
      # a compile error is reported as a failed build step instead of as a
      # server that never became ready — which is exactly how the first run of
      # this job failed, against the Nuxt dev server.
      - name: Build the app
        run: bun run build

      # Playwright starts the server itself (`webServer` in
      # playwright.config.ts). The override tells it the build is already done,
      # so it only has to serve the output — seconds, not minutes.
      #
      # RUNWAY_RLS_REQUIRE_STACK is the same guard the `database` job uses, for
      # the same reason: without it, a stack that failed to come up would make
      # every authenticated-session test skip itself and this job would report
      # green having checked no session at all.
      - name: E2E tests
        env:
          RUNWAY_RLS_REQUIRE_STACK: '1'
          RUNWAY_E2E_SERVER_COMMAND: bun run preview
        run: bun run test:e2e

      # Traces, screenshots and video for whatever failed. These contain
      # rendered page content — synthetic balances — which is why they are
      # uploaded as a restricted build artifact and never echoed into the log.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack diagnostics
        if: failure()
        run: docker ps -a --format 'table {{.Names}}\t{{.Status}}'

  security:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # Install so Trivy can walk node_modules as well as bun.lock — bun.lock
      # (text format) parsing is newer than the lockfile analysers Trivy has
      # had longest, so node_modules is the reliable signal.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
