# Nitro auto-detects the Netlify preset from the NETLIFY env var and emits
# `dist/` (static assets + _redirects) plus `.netlify/functions-internal/`.
# Do not hand-write [[redirects]] — the preset generates dist/_redirects.

[build]
  # Netlify's own dependency step keys off `bun.lockb`; this repo has the
  # text-format `bun.lock` (bun >= 1.2), which older build images do not detect.
  # Running `bun install` explicitly makes the build bun-only either way.
  command = "bun install --frozen-lockfile && bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.0"
  NODE_VERSION = "22.13.0"
  NODE_ENV = "development" # ensure devDependencies are installed for the build
